name = "google-analytics-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Import the tool descriptions as strings.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Created with `pnpm exec wrangler kv namespace create OAUTH_KV`.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "52339ebcd30d411682d80123f1049492"

[observability.logs]
enabled = true
